name: ShopSphere SDET Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Wait for ShopSphere application
        run: |
          for i in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 20 "$BASE_URL" > /dev/null; then
              echo "ShopSphere is reachable."
              exit 0
            fi

            echo "ShopSphere is not ready yet. Waiting 10 seconds..."
            sleep 10
          done

          echo "ShopSphere did not become reachable."
          exit 1

      - name: Run pytest
        run: |
          pytest -v --alluredir=allure-results

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn

      - name: Upload execution summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-execution-summary
          path: TEST_EXECUTION_SUMMARY.md
          if-no-files-found: warn

      - name: Load Allure history
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report
        if: always() && github.event_name != 'pull_request'
        uses: simple-elf/allure-report-action@master
        with:
          gh_pages: gh-pages
          allure_results: allure-results
          allure_history: allure-history

      - name: Upload Allure HTML report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: allure-html-report
          path: allure-history
          if-no-files-found: warn

      - name: Publish Allure report to GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          force_orphan: true